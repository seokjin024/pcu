<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>슈팅게임</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }
    </style>
</head>

<body>
    <h1>Space Shooter</h1>
    <p>점수: <span id="score">0</span> | 생명: <span id="life">3</span></p>
    <p>조작: ← / → 이동, Space 발사</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        const lifeText = document.getElementById("life");

        let score = 0;
        let life = 3;
        let gameOver = false;
        

        const player = {
            x : 280, y : 340, width : 40, height : 40, speed : 6
        }
        let normalSpeed = player.speed;
        let speedBoostCount = 0;
        function drawplayer() {
            ctx.fillStyle = "deepskyblue";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = "white";
            ctx.fillRect(player.x+15, player.y-10, 10, 10);
        }

        //drawplayer();

        const keys = {};

        document.addEventListener("keydown", function (event){
            keys[event.code] = true;
            if(event.code === "Space") {
                shootBullet();
            }
        });

        document.addEventListener("keyup", function (event){
            keys[event.code] = false;
        });

        function movePlayer() {
            if(keys["ArrowLeft"]) {
                player.x -= player.speed;
            }
            if(keys["ArrowRight"]) {
                player.x += player.speed;
            }
            if(player.x < 0){
                player.x = 0;
            }
            if(player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }
        }

        const bullets = [];

        function shootBullet() {
            bullets.push({x : player.x + player.width/2 - 3, y : player.y, 
                        width : 6, height : 12, speed : 7});
        }

        function drawBullets() {
            ctx.fillStyle = "yellow";

            for(let bullet of bullets){
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }
        }

        function moveBullets() {
            for(let bullet of bullets){
                bullet.y -= bullet.speed;
            }

            for(let i = bullets.length - 1; i>=0; i--){
                if(bullets[i].y + bullets[i].height < 0){
                    bullets.splice(i, 1);
                }
            }
        }

        const enemies = [];

        function createEnemy() {
            const enemy = {
                x : Math.random()*(canvas.width - 40), y : -40, width : 40, height : 40, 
                speed : Math.random() * 2 + 2
            };

            if(Math.random() < 0.1){
                enemy.special = true;
            }
            else{
                enemy.special = false;
            }

            enemies.push(enemy);
        }
        
        function drawEnemies() {

            for(let enemy of enemies) {
                if(enemy.special == true){
                    ctx.fillStyle = "gold";
                }
                else {
                    ctx.fillStyle = "crimson";
                }
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            }
        }

        function moveEnemies() {
            for(let enemy of enemies){
                enemy.y += enemy.speed;
            }
            for(let i = enemies.length - 1; i>=0; i--){
                if(enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);

                    life--;
                    lifeText.textContent = life;

                    if(life<=0) {
                        endGame();
                    }
                }
            }
        }

        function checkBulletEnemyCollision() {
            for(let i = enemies.length -1; i>=0; i--){
                const enemy = enemies[i];
                for(let j = bullets.length -1; j>=0; j--){
                    const bullet = bullets[j];

                    if(bullet.x < enemy.x + enemy.width && 
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y
                    ){if (enemy.special == true){
                        player.speed = normalSpeed + 5;
                            speedBoostCount = 180;
                        }
                    }
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score++;
                        scoreText.textContent = score;
                        break;
                    }
                    //coll
                }
            }
        
        function updateSpeedBoost() {
            if (speedBoostCount > 0) {
                speedBoostCount--;

                if(speedBoostCount == 0) {
                    player.speed = normalSpeed;
                }
            }
        }

        function checkPlayerEnemyCollision() {
            for(let i = enemies.length - 1; i>=0; i--){
                const enemy = enemies[i];
                if(player.x < enemy.x + enemy.width && 
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y){
                        enemies.splice(i, 1);
                        
                        life--;
                        lifeText.textContent = life;
                        if(life<=0){
                            endGame();
                        }
                }
            }
        }

        function endGame() {
            gameOver = true;

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText("게임 오버!", canvas.width/2, canvas.height/2 - 20);
            ctx.fillText("최종 점수 : " + score, canvas.width/2, canvas.height/2 + 30);
        }
        
        function gameLoop () {
            if(gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            movePlayer();
            moveBullets();
            moveEnemies();
            drawplayer();
            drawBullets();
            drawEnemies();
            checkBulletEnemyCollision();
            checkPlayerEnemyCollision();
            updateSpeedBoost();
            requestAnimationFrame(gameLoop);
        }
        setInterval(createEnemy, 1000);
        gameLoop();
    </script>
</body>

</html>
